  // ---- Config ----
  const colors = new Map([
    ["Interiority, Memory & Writing", "#ff7ab6"],
    ["Practice, Craft & Personal OS", "#a78bfa"],
    ["Limits of Measurement & Knowing", "#7aa2ff"],
    ["AI Society, Policy & Ethics", "#44d7b6"],
    ["Place, Cities & Belonging", "#fbbf24"],
    ["Scale & Infrastructure Reality", "#fb7185"],
    ["Other / Mixed", "#94a3b8"],
    ["Other", "#94a3b8"],
    ["", "#94a3b8"],
  ]);

  const margin = { top: 36, right: 30, bottom: 44, left: 54 };
  const extent = [-1, 1];

  const svg = d3.select("#chart");
  const tt = d3.select("#tt");
  const legend = d3.select("#legend");

  function resize() {
    const rect = svg.node().getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;

    svg.attr("viewBox", `0 0 ${width} ${height}`);
    svg.selectAll("*").remove();

    const innerW = width - margin.left - margin.right;
    const innerH = height - margin.top - margin.bottom;

    const x = d3.scaleLinear().domain(extent).range([0, innerW]);
    const y = d3.scaleLinear().domain(extent).range([innerH, 0]);

    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    // grid
    const gridTicks = d3.range(-1, 1.01, 0.25);
    g.append("g").selectAll("line.v")
      .data(gridTicks).join("line")
      .attr("x1", d => x(d)).attr("x2", d => x(d))
      .attr("y1", 0).attr("y2", innerH)
      .attr("stroke", "rgba(255,255,255,0.08)")
      .attr("stroke-width", 1);

    g.append("g").selectAll("line.h")
      .data(gridTicks).join("line")
      .attr("y1", d => y(d)).attr("y2", d => y(d))
      .attr("x1", 0).attr("x2", innerW)
      .attr("stroke", "rgba(255,255,255,0.08)")
      .attr("stroke-width", 1);

    // axes at 0
    g.append("line")
      .attr("x1", x(0)).attr("x2", x(0))
      .attr("y1", 0).attr("y2", innerH)
      .attr("stroke", "rgba(255,255,255,0.18)")
      .attr("stroke-width", 1.5);

    g.append("line")
      .attr("x1", 0).attr("x2", innerW)
      .attr("y1", y(0)).attr("y2", y(0))
      .attr("stroke", "rgba(255,255,255,0.18)")
      .attr("stroke-width", 1.5);

    // axis labels
    g.append("text").attr("x", 0).attr("y", -14).text("Digital ↑")
      .attr("fill", "rgba(230,232,238,0.88)").attr("font-size", 12).attr("font-weight", 650);

    g.append("text").attr("x", 0).attr("y", innerH + 34).text("Physical ↓")
      .attr("fill", "rgba(154,163,178,0.95)").attr("font-size", 12).attr("font-weight", 650);

    g.append("text").attr("x", -2).attr("y", innerH + 18).text("Interior ←")
      .attr("fill", "rgba(230,232,238,0.88)").attr("font-size", 12).attr("font-weight", 650)
      .attr("text-anchor", "start");

    g.append("text").attr("x", innerW + 2).attr("y", innerH + 18).text("→ External")
      .attr("fill", "rgba(230,232,238,0.88)").attr("font-size", 12).attr("font-weight", 650)
      .attr("text-anchor", "end");

    // quadrant hints
    g.append("text").attr("x", 8).attr("y", 16).text("Inner / Digital")
      .attr("fill", "rgba(154,163,178,0.75)").attr("font-size", 12);
    g.append("text").attr("x", innerW - 8).attr("y", 16).text("External / Digital")
      .attr("fill", "rgba(154,163,178,0.75)").attr("font-size", 12).attr("text-anchor","end");
    g.append("text").attr("x", 8).attr("y", innerH - 8).text("Inner / Physical")
      .attr("fill", "rgba(154,163,178,0.75)").attr("font-size", 12).attr("dominant-baseline","ideographic");
    g.append("text").attr("x", innerW - 8).attr("y", innerH - 8).text("External / Physical")
      .attr("fill", "rgba(154,163,178,0.75)").attr("font-size", 12).attr("text-anchor","end").attr("dominant-baseline","ideographic");

    // points + labels layers
    const pointsG = g.append("g").attr("class","points");
    const labelsG = g.append("g").attr("class","labels");

    // zoom/pan disabled (static view)

    // tooltip helpers
    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function trimNote(s) {
      const t = String(s || "").trim();
      if (!t) return "";
      return t.length > 240 ? t.slice(0, 240) + "…" : t;
    }
    function showTT(event, d) {
      const rect = svg.node().getBoundingClientRect();
      const x0 = event.clientX - rect.left + 14;
      const y0 = event.clientY - rect.top + 14;

      tt.html(`
        <div class="tt-title">${escapeHtml(d.title)}</div>
        <div class="tt-meta">
          <span>${escapeHtml(d.arc || "Other")}</span>
          <span>•</span>
          <span>${escapeHtml(d.domain || "")}</span>
          ${d.month ? `<span>•</span><span>${escapeHtml(d.month)}</span>` : ""}
        </div>
        ${d.note ? `<div class="tt-note">${escapeHtml(trimNote(d.note))}</div>` : ""}
        ${d.link ? `<div class="tt-meta" style="margin-top:8px;"><a href="${d.link}" target="_blank" rel="noopener">Open link</a></div>` : ""}
      `);

      tt.style("left", `${x0}px`).style("top", `${y0}px`).classed("on", true);
    }
    function hideTT() { tt.classed("on", false); }

    const nodes = pointsG.selectAll("circle")
      .data(data, d => d.title + "|" + (d.domain||""))
      .join("circle")
      .attr("cx", d => x(d.x))
      .attr("cy", d => y(d.y))
      .attr("r", 4.5)
      .attr("fill", d => colors.get(d.arc) || "#94a3b8")
      .attr("fill-opacity", 0.82)
      .attr("stroke", "rgba(255,255,255,0.35)")
      .attr("stroke-width", 1)
      .style("cursor", "pointer")
      .on("mousemove", (event, d) => showTT(event, d))
      .on("mouseleave", hideTT)
      .on("click", (event, d) => { if (d.link) window.open(d.link, "_blank", "noopener"); });

    function updateLabels(filteredSet) {
      labelsG.selectAll("text").remove();
      const showLabels = document.getElementById("labels").checked;
      if (!showLabels) return;

      const labelData = filteredSet ? data.filter(d => filteredSet.has(d)) : data;

      labelsG.selectAll("text")
        .data(labelData)
        .join("text")
        .attr("x", d => x(d.x) + 7)
        .attr("y", d => y(d.y) + 4)
        .text(d => d.title)
        .attr("fill", "rgba(230,232,238,0.78)")
        .attr("font-size", 10.5)
        .attr("paint-order", "stroke")
        .attr("stroke", "rgba(11,15,23,0.85)")
        .attr("stroke-width", 3);
    }

    function applyQuery() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const dim = document.getElementById("dim").checked;

      if (!q) {
        nodes.attr("fill-opacity", 0.82).attr("stroke-opacity", 1);
        updateLabels(null);
        return;
      }

      const matches = new Set();
      for (const d of data) {
        const hay = `${d.title} ${d.domain} ${d.arc} ${d.month}`.toLowerCase();
        if (hay.includes(q)) matches.add(d);
      }

      nodes
        .attr("fill-opacity", d => matches.has(d) ? 0.92 : (dim ? 0.10 : 0.82))
        .attr("stroke-opacity", d => matches.has(d) ? 1.0 : (dim ? 0.25 : 1.0));

      updateLabels(matches);
    }

    document.getElementById("q").addEventListener("input", applyQuery);
    document.getElementById("labels").addEventListener("change", applyQuery);
    document.getElementById("dim").addEventListener("change", applyQuery);

    // legend
    const arcCounts = d3.rollup(data, v => v.length, d => d.arc || "Other");
    const rows = Array.from(arcCounts, ([arc, count]) => ({ arc, count }))
      .sort((a,b) => d3.descending(a.count, b.count));

    legend.html("");
    for (const r of rows) {
      const div = legend.append("div").attr("class","row");
      div.append("div").attr("class","swatch").style("background", colors.get(r.arc) || "#94a3b8");
      div.append("div").html(`<span style="color:rgba(230,232,238,0.92)">${r.arc}</span> <span style="color:rgba(154,163,178,0.9)">(${r.count})</span>`);
    }

    applyQuery();
  }

  window.addEventListener("resize", resize);
  resize();
  </script>
