<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Strava Poster – Miles</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root{
      --sky: #A8D0E6;
      --coral: #F76C6C;
      --butter: #F8E9A1;
      --indigo: #374785;
      --navy: #24305E;

      --offwhite: #F1F1F3;
      --sky-100: #BFDDEF;
      --slate-200: #A6B0C8;

      --bg: var(--offwhite);
      --ink: #0f172a;
      --muted: #475569;
      --grid: rgba(36,48,94,0.18);
      --axis: rgba(36,48,94,0.35);
    }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 24px 34px;
    }
    h1{
      margin:0 0 6px;
      font-size: 52px;
      letter-spacing: -0.8px;
      line-height: 1.0;
      font-weight: 800;
      color: var(--navy);
    }
    .subtitle{
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 10px;
    }
    .kpis{
      display:flex;
      gap: 18px;
      flex-wrap:wrap;
      margin-top: 4px;
      margin-bottom: 18px;
    }
    .kpi .v{ font-weight: 800; font-size: 16px; color: var(--indigo); }
    .kpi .l{ font-size: 12px; color: var(--muted); }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 22px;
      align-items:start;
    }
    .panel{ padding: 0; }
    .panel.wide{ grid-column: span 2; }
    .ptitle{
      font-weight: 800;
      font-size: 22px;
      margin: 0 0 2px;
    }
    .ptitle.distance{ color: var(--indigo); }
    .ptitle.cum{ color: var(--navy); }
    .ptitle.pace{ color: var(--coral); }
    .pnote{
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .chart{ height: 300px; }
    .footer{
      margin-top: 16px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 920px){
      .grid{ grid-template-columns: 1fr; }
      .panel.wide{ grid-column: span 1; }
    }
    @media print{
      body{ background:#fff; }
      .wrap{ max-width: 100%; padding: 18px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="subtitle" id="subtitle"></div>
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="panel">
      <div class="ptitle distance">Distance</div>
      <div class="pnote">Distance <b>per run</b> and <b>per week</b>, miles</div>
      <div id="distance" class="chart"></div>
    </div>

    <div class="panel">
      <div class="ptitle cum">Cumulative distance</div>
      <div class="pnote">Cumulative distance run, miles</div>
      <div id="cum" class="chart"></div>
    </div>

    <div class="panel wide">
      <div class="ptitle pace">Pace</div>
      <div class="pnote">Average pace per run, minutes per mile</div>
      <div id="pace" class="chart"></div>
    </div>
  </div>

  <div class="footer">
    <div>data from your Strava export</div>
    <div>viz by ChatGPT • tip: Print → Save as PDF</div>
  </div>
</div>
